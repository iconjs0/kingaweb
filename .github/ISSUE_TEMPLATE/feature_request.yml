name: Feature request
description: Propose a customer problem or product improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what evidence shows it matters?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing implementation unnecessarily.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security, privacy and abuse considerations
      description: Note permissions, sensitive data, scanning behavior or misuse risks.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
